<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a63;--ac:#1f6f5c;--ac2:#e3f1ec;--bd:#dedcd3;--rd:#b3372b;--or:#b86a00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--card:#222320;--tx:#efeee8;--mu:#a3a298;--ac:#5cc3a6;--ac2:#1f3a32;--bd:#3a3b36;--rd:#ff8a7d;--or:#f0b050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161715;--card:#222320;--tx:#efeee8;--mu:#a3a298;--ac:#5cc3a6;--ac2:#1f3a32;--bd:#3a3b36;--rd:#ff8a7d;--or:#f0b050;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:16px 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
input,select,textarea,button{font:inherit;color:var(--tx)}
input[type=color]{height:44px;padding:2px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin:3px 0}
textarea{min-height:130px;font:12px/1.4 ui-monospace,monospace}
button{padding:10px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--rd)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#0c1a15}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>button{flex:0 0 auto}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}.mu{color:var(--mu);font-size:14px}.ck{display:flex;gap:12px;flex-wrap:wrap}.ck label{display:flex;gap:4px;align-items:center}.ck input{width:auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 2px;font-size:13px;color:var(--mu)}
nav button.on{color:var(--ac);font-weight:600;box-shadow:inset 0 2px var(--ac)}
.bd{font-size:13px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);white-space:nowrap}.bd.w{background:transparent;border:1px solid var(--or);color:var(--or)}
#reader{width:100%;max-width:360px;margin:8px auto}
.banner{padding:10px;border-radius:8px;background:var(--ac2);color:var(--ac);font-weight:600;margin:8px 0}
.banner.e{background:transparent;border:1px solid var(--rd);color:var(--rd)}
.big{font-size:20px;font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal .box{background:#fff;color:#111;border-radius:14px;padding:18px;text-align:center;max-width:320px}
#qr{display:flex;justify-content:center;margin:10px 0}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.qc{border:1px dashed var(--bd);border-radius:8px;padding:8px;text-align:center;font-size:13px;background:#fff;color:#111}
.qc .q{display:flex;justify-content:center}
@media print{nav,.noprint{display:none!important}body{background:#fff}}
#pv{display:none;position:fixed;inset:0;z-index:20;background:#d9d9d4;overflow:auto;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
#pv.on{display:block}.pvt{display:flex;gap:8px;margin:0 auto 10px;max-width:210mm}.pvt button{flex:1}
.sheet{width:min(210mm,100%);margin:0 auto;background:#fff;color:#111;padding:10mm 18mm;font-family:Helvetica,Arial,sans-serif}
.ptt{font-size:19pt;font-weight:800;color:#0f294a;line-height:1.1}.psub{display:flex;justify-content:space-between;align-items:center;margin-top:1.5mm;font-size:9.5pt;color:#64748b;padding-bottom:3mm;border-bottom:.65mm solid #0f294a;margin-bottom:5mm}
.pbd{border:.3mm solid #bfdbfe;background:#eff6ff;color:#1d4ed8;font-weight:700;border-radius:1.6mm;padding:1mm 3.5mm;white-space:nowrap}
.pgh{display:flex;justify-content:space-between;background:#eef2f7;border-left:1.1mm solid #1d4ed8;padding:2.2mm 4mm;margin:2mm 0 4mm;font-weight:700;font-size:11.5pt;color:#0f294a;break-after:avoid}.pgh span{font-size:9.5pt;color:#64748b}
.pgr{display:grid;grid-template-columns:1fr 1fr;gap:4mm 4.2mm;padding:0 3.9mm;margin-bottom:5mm}
.pc{border:.35cqw solid #0f294a;border-radius:1.7cqw;overflow:hidden;background:#fff;aspect-ratio:230/109;display:flex;flex-direction:column;container-type:inline-size;break-inside:avoid;color:#111}
.ph{height:10cqw;background:#0f294a;display:flex;align-items:center;padding:0 3cqw;flex:none}
.pl{width:7.4cqw;height:7.4cqw;background:#fff;border-radius:1.3cqw;display:flex;align-items:center;justify-content:center;margin-right:3cqw;flex:none}.pl img{height:6.2cqw;width:6.2cqw;object-fit:contain}
.pt1{font-size:5.2cqw;font-weight:800;letter-spacing:.55cqw;line-height:1;color:#fff}.pt2{font-size:2.1cqw;font-weight:700;letter-spacing:.24cqw;color:#93b4e8;margin-top:.8cqw;line-height:1}
.pb{flex:1;display:flex;justify-content:space-between;padding:1.4cqw 3.5cqw 1.4cqw 4cqw;min-height:0}
.px{flex:1;min-width:0;font-size:3.57cqw;line-height:5.75cqw;color:#1f2937;padding-top:1cqw}.pr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pr b{color:#0f294a;margin-right:.6cqw}
.pq{width:25.2cqw;height:28.7cqw;border:.26cqw dashed #93b4e8;border-radius:1.1cqw;display:flex;flex-direction:column;align-items:center;padding-top:1.6cqw;margin-left:2cqw;flex:none}
.qrb{width:20cqw;height:20cqw}.qrb img,.qrb canvas{width:100%!important;height:100%!important;image-rendering:pixelated;display:block}
.pi{font-family:"Courier New",monospace;font-weight:700;font-size:2.56cqw;color:#0f294a;margin-top:auto;padding-bottom:1.2cqw}
.pf{height:5.2cqw;background:#0f294a;color:#fff;font-size:2.7cqw;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
@media (max-width:600px){.pgr{grid-template-columns:1fr;padding:0}.sheet{padding:6mm 4mm}}
@media print{@page{size:A4;margin:11mm 0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body>*:not(#pv){display:none!important}#pv{position:static!important;display:block!important;background:#fff;padding:0;overflow:visible}.pvt{display:none}.sheet{width:auto;margin:0;padding:0 18.3mm}.pgr{grid-template-columns:1fr 1fr!important;padding:0 3.9mm!important}}
</style></head><body>

function getAnneeScolaire(date = new Date()) {
  const annee = date.getFullYear();
  const mois = date.getMonth() + 1;

  // Juillet = pause entre deux années scolaires
  if (mois === 7) {
    return {
      label: `${annee - 1}-${annee}`,
      statut: 'pause',
      message: `Vacances d'été — année scolaire ${annee - 1}-${annee} terminée`
    };
  }

  if (mois >= 8) {
    return {
      label: `${annee}-${annee + 1}`,
      statut: 'active'
    };
  }

  return {
    label: `${annee - 1}-${annee}`,
    statut: 'active'
  };
}

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- Groupes ---------- */
function vG(){
 $('v').innerHTML=annCard()+`<div class="card"><input id="gn" placeholder="Nom du groupe (ex. 3ème info – A)"><input id="gh" placeholder="Jour et horaire (ex. Samedi 10h)"><label class="mu">Couleur du groupe</label><input id="gc" type="color" value="${PAL[D.groups.length%PAL.length]}"><button class="p" onclick="addG()">Ajouter le groupe</button></div>`+

function bulkSd(){const L=D.students.filter(s=>!fg||s.g===fg);if(!L.length)return;const v=prompt('Nombre de séances de départ pour ces '+L.length+' élèves :','0');if(v===null)return;const n=parseInt(v)||0;L.forEach(s=>s.sd=n);save();vE()}
function closePv(){$('pv').classList.remove('on');document.body.style.overflow=''}
function qrM(el,t){el.innerHTML='';try{new QRCode(el,{text:t,width:300,height:300,correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent=t}}

 if(!fg){const o=D.students.filter(s=>!G(s.g));if(o.length)gl.push([{name:'Sans groupe',h:''},o])}

 <div class="row"><div><label class="mu">Niveau</label><select id="f_niv">${opts(NIV,s.niv)}</select></div><div><label class="mu">Section</label><select id="f_sec">${opts(SEC,s.sec)}</select></div></div>
 ${fld('f_ly','Lycée',s.ly)}${fld('f_sd','Séances de départ (séances faites avant l’application ; négatif si payé d’avance)',s.sd||0,'number')}<label class="mu">Groupe (modifiable à tout moment)</label><select id="f_g"><option value="">—</option>${gopts(s.g)}</select>

  D.pays.filter(p=>p.s===s.id).sort((a,b)=>b.d.localeCompare(a.d)).map(p=>`<div class="it"><span>${p.d} · <b>${p.a}</b> <span class="mu">(${p.n} séances)</span></span><button class="d" onclick="delPay('${p.id}')">✕</button></div>`).join('')+`</div>`;
  h+=`<div class="card"><b>Séances suivies</b>`+(D.sessions.filter(x=>x.att.includes(s.id)).sort((a,b)=>b.d.localeCompare(a.d)).map(x=>`<div class="it"><span>${x.d} · ${esc(x.m)}</span><span class="mu">${esc(gn(x.g))}</span></div>`).join('')||'<div class="mu">Aucune.</div>')+`</div>
  <div class="row"><button onclick="showQ('${s.id}')">QR code</button><button class="d" onclick="delS('${s.id}')">Supprimer l’élève</button></div>`}
 $('v').innerHTML=h;

 const nw=stu==='new',s=nw?draft:S(stu),g=i=>$(i).value.trim();
 if(!g('f_n')&&!g('f_p'))return alert('Saisis au moins un nom ou un prénom.');
 Object.assign(s,{n:g('f_n'),p:g('f_p'),t:g('f_t'),tp:g('f_tp'),niv:$('f_niv').value,sec:$('f_sec').value,ly:g('f_ly'),sd:parseInt(g('f_sd'))||0,g:$('f_g').value,m:[...document.querySelectorAll('.ck input:checked')].map(c=>c.value)});

function addPay(){const a=parseFloat($('pa').value),n=parseInt($('pn').value);if(!(a>=0)||!(n>0))return alert('Montant et nombre de séances requis.');D.pays.push({id:uid(),s:stu,d:$('pd').value||today(),a,n});save();render()}

/* ---------- Séances ---------- */
function vS(){
 if(!D.groups.length){$('v').innerHTML='<p class="mu">Crée d’abord un groupe.</p>';return}
 $('v').innerHTML=bkWarn()+`<div class="card"><select id="sg">${gopts('')}</select><div class="row"><input id="sd" type="date" value="${today()}"><select id="sm">${opts(MAT)}</select></div><button class="p" onclick="newSess()">Nouvelle séance</button></div>`+
 D.sessions.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(x=>`<div class="card it" ${gs(x.g)} onclick="sid='${x.id}';render()"><div><b>${x.d} · ${esc(x.m)}</b><div class="mu">${esc(gn(x.g))}</div></div><span class="bd">${x.att.length} présent${x.att.length>1?'s':''}</span></div>`).join('');
}
function bkWarn(){const l=lastBk(),d=l?Math.floor((Date.now()-l)/864e5):-1;if(!D.students.length||(l&&d<7))return'';return `<div class="banner e" onclick="tab='x';render()">⚠ ${l?'Dernière sauvegarde il y a '+d+' jours':'Aucune sauvegarde'} — touche pour sauvegarder</div>`}
function newSess(){const x={id:uid(),g:$('sg').value,d:$('sd').value||today(),m:$('sm').value,att:[]};D.sessions.push(x);save();sid=x.id;render()}
function vSess(){
 const x=SE(sid);if(!x){sid='';return render()}
 $('v').innerHTML=`<button onclick="stop();sid='';render()">← Retour</button> <button class="d" onclick="delSess()">Supprimer la séance</button>
 <p><b>${x.d} · ${esc(x.m)}</b> <span class="mu">${esc(gn(x.g))}</span></p>
 <div class="row"><button class="p" onclick="start()">📷 Scanner</button><button onclick="stop()">Arrêter</button></div>
 <div id="reader"></div><div id="bn"></div>
 <input id="mq" placeholder="🔍 Chercher un élève à ajouter…" oninput="fillMs()"><div class="row"><select id="ms"></select><button onclick="addMan()">Ajouter</button></div><div id="ls"></div>`;list();fillMs();
}
function list(){const x=SE(sid);$('ls').innerHTML=`<h2>${x.att.length} présent(s)</h2>`+x.att.map(i=>S(i)).filter(Boolean).map(s=>{const u=unp(s);return `<div class="card it" ${gs(s.g)}><span>${esc(full(s))} <span class="bd${u>0?' w':''}">${lab(u)}</span></span><button class="d" onclick="rm('${s.id}')">✕</button></div>`}).join('')}
function fillMs(){const x=SE(sid),q=norm($('mq').value);$('ms').innerHTML=D.students.filter(s=>!x.att.includes(s.id)&&(!q||norm(full(s)+' '+s.ly).includes(q))).sort((a,b)=>(b.g===x.g)-(a.g===x.g)).map(s=>`<option value="${s.id}">${esc(full(s))} — ${esc(gn(s.g))}</option>`).join('')}

function bn(m,e){$('bn').innerHTML=`<div class="banner${e?' e':''}">${m}</div>`}
function start(){
 if(scanner)return;
 try{scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:220},onScan,()=>{}).catch(()=>{scanner=null;bn('Caméra inaccessible. Autorise-la, ou ajoute les élèves à la main.',1)})}
 catch(e){scanner=null;bn('Scanner indisponible sur cet appareil.',1)}
}
function stop(){if(scanner){const s=scanner;scanner=null;s.stop().then(()=>s.clear()).catch(()=>{})}}
let last='',lt=0;
function onScan(t){
 const n=Date.now();if(t===last&&n-lt<2500)return;last=t;lt=n;
 const s=S(t),x=SE(sid);
 if(!s)return bn('QR code inconnu',1);
 if(x.att.includes(s.id))return bn(esc(full(s))+' : déjà présent');
 add(s.id);try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
 const u=unp(s);bn('✓ '+esc(full(s))+(u>0?' · '+u+' séance'+(u>1?'s':'')+' non payée'+(u>1?'s':''):u<0?' · avance de '+(-u)+' séance'+(u<-1?'s':''):''),u>2);list();
}

const q=s=>"'"+String(s==null?'':s).replace(/'/g,"''")+"'";
function genSQL(){
 let o='CREATE TABLE groupes(id TEXT PRIMARY KEY,nom TEXT,horaire TEXT,couleur TEXT);\nCREATE TABLE eleves(id TEXT PRIMARY KEY,nom TEXT,prenom TEXT,tel TEXT,tel_parent TEXT,niveau TEXT,section TEXT,lycee TEXT,groupe_id TEXT,matieres TEXT,seances_depart INTEGER);\nCREATE TABLE seances(id TEXT PRIMARY KEY,groupe_id TEXT,date TEXT,matiere TEXT);\nCREATE TABLE presences(seance_id TEXT,eleve_id TEXT);\nCREATE TABLE paiements(id TEXT PRIMARY KEY,eleve_id TEXT,date TEXT,montant REAL,nb_seances INTEGER);\n';
 D.groups.forEach(g=>o+=`INSERT INTO groupes VALUES(${q(g.id)},${q(g.name)},${q(g.h)},${q(g.c)});\n`);
 D.students.forEach(s=>o+=`INSERT INTO eleves VALUES(${q(s.id)},${q(s.n)},${q(s.p)},${q(s.t)},${q(s.tp)},${q(s.niv)},${q(s.sec)},${q(s.ly)},${q(s.g)},${q(s.m.join(','))},${s.sd||0});\n`);
 D.sessions.forEach(x=>{o+=`INSERT INTO seances VALUES(${q(x.id)},${q(x.g)},${q(x.d)},${q(x.m)});\n`;x.att.forEach(a=>o+=`INSERT INTO presences VALUES(${q(x.id)},${q(a)});\n`)});
 D.pays.forEach(p=>o+=`INSERT INTO paiements VALUES(${q(p.id)},${q(p.s)},${q(p.d)},${p.a},${p.n});\n`);return o}
function genCSV(){return 'nom;prenom;tel;tel_parent;niveau;section;lycee;groupe;matieres;seances_depart;seances_suivies;seances_payees;non_payees\n'+D.students.map(s=>[s.n,s.p,s.t,s.tp,s.niv,s.sec,s.ly,gn(s.g),s.m.join('+'),s.sd||0,att(s),paid(s),unp(s)].join(';')).join('\n')}
function genPay(){return 'date;eleve;montant;nb_seances\n'+D.pays.map(p=>{const s=S(p.s);return [p.d,s?full(s):'?',p.a,p.n].join(';')}).join('\n')}

function authErr(c){c=String(c||'');if(/EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS/.test(c))return'E-mail ou mot de passe incorrect';if(/TOO_MANY/.test(c))return'Trop d’essais, réessaie plus tard';if(/OPERATION_NOT_ALLOWED/.test(c))return'La connexion par e-mail n’est pas activée dans Firebase';if(/USER_DISABLED/.test(c))return'Ce compte est désactivé';return'Connexion refusée ('+c+')'}
async function fbReq(m,u,t,b){

 const j=await r.json().catch(()=>({}));
 if(!r.ok){const st=j.error&&j.error.status;throw new Error(st==='PERMISSION_DENIED'?'Accès refusé : vérifie les règles Firestore':st==='NOT_FOUND'?'Base Firestore introuvable : crée-la dans la console Firebase':'Erreur : '+((j.error&&j.error.message)||r.status))}
 return j}
async function fbTok(){
 if(fb&&fb.exp>Date.now()+60000)return fb.tok;
 const s=JSON.parse(ls(K+'_fb')||'null');if(!s)throw new Error('Non connecté');
 let r;try{r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FBK,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(s.rt)})}catch(e){throw new Error('Pas de connexion internet')}
 const j=await r.json();if(!r.ok)throw new Error('Session expirée : reconnecte-toi');
 fb={tok:j.id_token,exp:Date.now()+j.expires_in*1000,uid:j.user_id,email:s.email};
 ls(K+'_fb',JSON.stringify({email:s.email,rt:j.refresh_token,uid:j.user_id}));return fb.tok}
async function pack(t){try{if(window.CompressionStream){const b=new Uint8Array(await new Response(new Blob([t]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());let bin='';for(let i=0;i<b.length;i+=8192)bin+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return'gz:'+btoa(bin)}}catch(e){}return'raw:'+t}
async function unpack(c){if(c.startsWith('raw:'))return c.slice(4);const b=Uint8Array.from(atob(c.slice(3)),x=>x.charCodeAt(0));return await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
function fbMsg(m,e){const x=$('fbm');if(x)x.innerHTML=`<div class="banner${e?' e':''}">${esc(m)}</div>`}
async function fbLogin(){
 const e=$('fe').value.trim(),p=$('fp').value;if(!e||!p)return fbMsg('Saisis ton e-mail et ton mot de passe',1);
 fbMsg('Connexion…');
 try{let r;try{r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+FBK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p,returnSecureToken:true})})}catch(x){throw new Error('Pas de connexion internet')}
 const j=await r.json();if(!r.ok)throw new Error(authErr(j.error&&j.error.message));
 fb={tok:j.idToken,exp:Date.now()+j.expiresIn*1000,uid:j.localId,email:e};ls(K+'_fb',JSON.stringify({email:e,rt:j.refreshToken,uid:j.localId}));vX()}catch(x){fbMsg(x.message,1)}}
function fbOut(){ls(K+'_fb','');fb=null;vX()}
async function fbBackup(note){
 const t=await fbTok(),sql=genSQL(),c=await pack(sql);
 await fbReq('POST',col(),t,{fields:{created:{timestampValue:new Date().toISOString()},note:{stringValue:note||''},nb:{integerValue:String(D.students.length)},taille:{integerValue:String(sql.length)},contenu:{stringValue:c}}});
 ls(K+'_fbl',String(Date.now()));markBk();
 try{const r=await fbReq('GET',col()+'?pageSize=100&orderBy='+encodeURIComponent('created desc')+'&mask.fieldPaths=created',t);for(const x of (r.documents||[]).slice(40))await fbReq('DELETE','https://firestore.googleapis.com/v1/'+x.name,t)}catch(e){}}
async function fbNow(){fbMsg('Envoi en cours…');try{await fbBackup(($('fn').value||'').trim());$('fn').value='';fbMsg('✓ Sauvegarde envoyée le '+new Date().toLocaleString('fr-FR'));fbList()}catch(x){fbMsg(x.message,1)}}
async function fbList(){
 const box=$('fl');if(!box)return;box.innerHTML='<div class="mu">Chargement…</div>';
 try{const t=await fbTok(),r=await fbReq('GET',col()+'?pageSize=60&orderBy='+encodeURIComponent('created desc')+'&mask.fieldPaths=created&mask.fieldPaths=note&mask.fieldPaths=nb',t);
 const L=r.documents||[];
 box.innerHTML=L.length?L.map(d=>{const f=d.fields||{},id=d.name.split('/').pop(),dt=f.created?new Date(f.created.timestampValue).toLocaleString('fr-FR'):'?';return `<div class="it"><div><b>${dt}</b><div class="mu">${f.nb?f.nb.integerValue:'?'} élèves${f.note&&f.note.stringValue?' · '+esc(f.note.stringValue):''}</div></div><span class="row"><button onclick="fbRestore('${id}')">Restaurer</button><button class="d" onclick="fbDel('${id}')">✕</button></span></div>`}).join(''):'<div class="mu">Aucune sauvegarde en ligne pour le moment.</div>'
 }catch(x){box.innerHTML=`<div class="banner e">${esc(x.message)}</div>`}}
async function fbRestore(id){
 if(!confirm('Restaurer cette sauvegarde ? Les données actuelles seront remplacées.'))return;
 try{const t=await fbTok(),d=await fbReq('GET',col()+'/'+id,t),j=fromSQL(await unpack(d.fields.contenu.stringValue));
 ls(K+'_fbl',String(Date.now()));D=Object.assign({groups:[],students:[],sessions:[],pays:[]},j);save();alert('Sauvegarde restaurée');tab='s';sid='';stu='';render()}catch(x){fbMsg(x.message,1)}}
async function fbDel(id){if(!confirm('Supprimer ce point de restauration ?'))return;try{await fbReq('DELETE',col()+'/'+id,await fbTok());fbList()}catch(x){fbMsg(x.message,1)}}
function autoBk(){
 if(!fbOn()||ls(K+'_auto')==='0')return;clearTimeout(atm);
 atm=setTimeout(async()=>{if(Date.now()-(+ls(K+'_fbl')||0)<864e5)return;try{await fbBackup('automatique')}catch(e){}},8000)}
function fbCard(){
 const s=JSON.parse(ls(K+'_fb')||'null');
 if(!s)return `<div class="card"><b>☁ Sauvegarde en ligne</b><div class="mu">Connecte-toi pour enregistrer tes sauvegardes en ligne, chacune avec sa date.</div><input id="fe" type="email" placeholder="E-mail" autocomplete="username"><input id="fp" type="password" placeholder="Mot de passe" autocomplete="current-password"><button class="p" onclick="fbLogin()">Se connecter</button><div id="fbm"></div></div>`;
 return `<div class="card"><b>☁ Sauvegarde en ligne</b><div class="mu">Connecté : ${esc(s.email)}</div><input id="fn" placeholder="Note (facultatif)"><button class="p" onclick="fbNow()">☁ Sauvegarder en ligne maintenant</button><label style="display:flex;gap:6px;align-items:center;margin:8px 0"><input type="checkbox" style="width:auto"${ls(K+'_auto')==='0'?'':' checked'} onchange="ls(K+'_auto',this.checked?'1':'0')"> Sauvegarde automatique (1 par jour au plus)</label><div id="fbm"></div><h2>Points de restauration</h2><div id="fl"></div><p><button onclick="fbOut()">Se déconnecter</button></p></div>`}
/*FB-END*/
/*PUB-START*/
const dbp=()=>`projects/${FBP}/databases/(default)/documents`,DBU=()=>`https://firestore.googleapis.com/v1/${dbp()}`;
function toFS(v){
 if(v===null||v===undefined)return{nullValue:null};
 if(typeof v==='string')return{stringValue:v};
 if(typeof v==='boolean')return{booleanValue:v};
 if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
 if(Array.isArray(v))return{arrayValue:{values:v.map(toFS)}};
 return{mapValue:{fields:Object.fromEntries(Object.entries(v).map(([k,x])=>[k,toFS(x)]))}}}
const hs=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return t.length+':'+h};
function portailDoc(s){
 const g=G(s.g),am=ls(K+'_amt')!=='0';
 return{n:s.n||'',p:s.p||'',niv:s.niv||'',sec:s.sec||'',m:s.m||[],g:s.g||'',gn:g?g.name:'',gh:g?(g.h||''):'',
  nbs:att(s),nbp:paid(s),solde:unp(s),sd:s.sd||0,
  pres:D.sessions.filter(x=>x.att.includes(s.id)).sort((a,b)=>b.d.localeCompare(a.d)).map(x=>({d:x.d,m:x.m})),
  pay:D.pays.filter(p=>p.s===s.id).sort((a,b)=>b.d.localeCompare(a.d)).map(p=>am?{d:p.d,n:p.n,a:p.a}:{d:p.d,n:p.n})}}
async function fbPublish(force){
 const t=await fbTok(),old=JSON.parse(ls(K+'_pubh')||'{}'),nh={},W=[];
 for(const s of D.students){const d=portailDoc(s);nh[s.id]=hs(JSON.stringify(d));if(force||old[s.id]!==nh[s.id]){d.maj=new Date().toISOString();W.push({update:{name:dbp()+'/portail/'+s.id,fields:toFS(d).mapValue.fields}})}}
 const ex=await fbReq('GET',DBU()+'/portail?pageSize=300&mask.fieldPaths=n',t),keep=new Set(D.students.map(s=>s.id));
 (ex.documents||[]).forEach(x=>{if(!keep.has(x.name.split('/').pop()))W.push({delete:x.name})});
 for(let i=0;i<W.length;i+=400)await fbReq('POST',DBU()+':commit',t,{writes:W.slice(i,i+400)});
 ls(K+'_pubh',JSON.stringify(nh));ls(K+'_pubt',String(Date.now()));return W.length}
function autoPub(){if(!fbOn()||ls(K+'_pub')!=='1')return;clearTimeout(ptm);ptm=setTimeout(()=>fbPublish().catch(()=>{}),15000)}
async function pubNow(){const x=$('pbm');x.innerHTML='<div class="banner">Publication…</div>';try{await fbPublish(true);x.innerHTML=`<div class="banner">✓ ${D.students.length} fiches publiées le ${new Date().toLocaleString('fr-FR')}</div>`}catch(e){x.innerHTML=`<div class="banner e">${esc(e.message)}</div>`}}
function togPub(c){ls(K+'_pub',c?'1':'0');if(c)autoPub()}
function togAmt(c){ls(K+'_amt',c?'1':'0');ls(K+'_pubh','{}');autoPub()}
function fbPubCard(){
 const s=JSON.parse(ls(K+'_fb')||'null');if(!s)return'';
 const link=ELEVE_URL,pt=+ls(K+'_pubt')||0;
 return `<div class="card"><b>🎓 Application élève</b><div class="mu">Lien à donner aux élèves : <span style="word-break:break-all;user-select:all">${esc(link)}</span></div><div class="mu">Ton UID (pour les règles Firestore) : <span style="word-break:break-all;user-select:all">${esc(s.uid||'')}</span></div>
 <label style="display:flex;gap:6px;align-items:center;margin:8px 0"><input type="checkbox" style="width:auto"${ls(K+'_pub')==='1'?' checked':''} onchange="togPub(this.checked)"> Publier automatiquement les fiches élèves</label>
 <label style="display:flex;gap:6px;align-items:center;margin:8px 0"><input type="checkbox" style="width:auto"${ls(K+'_amt')==='0'?'':' checked'} onchange="togAmt(this.checked)"> Montrer les montants payés aux élèves</label>
 <button class="p" onclick="pubNow()">📤 Publier maintenant</button><div class="mu">${pt?'Dernière publication : '+new Date(pt).toLocaleString('fr-FR'):'Pas encore publié.'}</div><div id="pbm"></div></div>`}
function annCard(){
 if(!fbOn())return `<div class="card"><b>📢 Annonces aux élèves</b><div class="mu">Connecte-toi dans l’onglet Export pour publier des annonces.</div></div>`;
 return `<div class="card"><b>📢 Nouvelle annonce</b><select id="ac"><option value="all">Tous les groupes</option>${gopts('')}</select>
 <select id="at"><option value="info">Information (séance reportée…)</option><option value="devoir">Travail à faire</option></select>
 <input id="ati" placeholder="Titre (ex. Séance de samedi reportée à 16h)"><textarea id="atx" style="min-height:70px" placeholder="Détails (facultatif)"></textarea>
 <label class="mu">Date limite (pour un travail)</label><input id="adl" type="date"><button class="p" onclick="postAnn()">Publier l’annonce</button><div id="am"></div><div id="al"></div></div>`}
function annMsg(m,e){const x=$('am');if(x)x.innerHTML=`<div class="banner${e?' e':''}">${esc(m)}</div>`}
async function postAnn(){
 const ti=$('ati').value.trim();if(!ti)return annMsg('Saisis un titre',1);
 try{const t=await fbTok(),f=toFS({cible:$('ac').value,type:$('at').value,titre:ti,texte:$('atx').value.trim(),limite:$('at').value==='devoir'?($('adl').value||''):''}).mapValue.fields;
 f.cree={timestampValue:new Date().toISOString()};
 await fbReq('POST',DBU()+'/annonces',t,{fields:f});$('ati').value='';$('atx').value='';annMsg('✓ Annonce publiée');annList()}catch(e){annMsg(e.message,1)}}
async function annList(){
 const b=$('al');if(!b||!fbOn())return;
 try{const t=await fbTok(),r=await fbReq('GET',DBU()+'/annonces?pageSize=20&orderBy='+encodeURIComponent('cree desc'),t);
 b.innerHTML=(r.documents||[]).map(d=>{const f=d.fields||{},v=k=>f[k]&&f[k].stringValue||'',id=d.name.split('/').pop();return `<div class="it"><div><b>${v('type')==='devoir'?'📝':'📢'} ${esc(v('titre'))}</b><div class="mu">${v('cible')==='all'?'Tous':esc(gn(v('cible')))} · ${f.cree?new Date(f.cree.timestampValue).toLocaleDateString('fr-FR'):''}${v('limite')?' · pour le '+v('limite'):''}</div></div><button class="d" onclick="delAnn('${id}')">✕</button></div>`}).join('')||'<div class="mu">Aucune annonce.</div>'}catch(e){b.innerHTML=`<div class="banner e">${esc(e.message)}</div>`}}
async function delAnn(id){if(confirm('Supprimer cette annonce ?'))try{await fbReq('DELETE',DBU()+'/annonces/'+id,await fbTok());annList()}catch(e){annMsg(e.message,1)}}
/*PUB-END*/
function vX(){
 $('v').innerHTML=fbCard()+fbPubCard()+`<div class="card"><p><button class="p" onclick="out(genSQL(),'gestion.sql','text/plain');dl()">💾 Sauvegarder maintenant (fichier SQL)</button></p><div class="mu">${lastBk()?'Dernière sauvegarde : '+new Date(lastBk()).toLocaleString('fr-FR'):'Aucune sauvegarde pour le moment.'}</div><div class="row"><button onclick="out(genSQL(),'gestion.sql','text/plain')">SQL</button><button onclick="out(genCSV(),'eleves.csv','text/csv')">CSV élèves</button><button onclick="out(genPay(),'paiements.csv','text/csv')">CSV paiements</button><button onclick="out(JSON.stringify(D),'sauvegarde.json','application/json')">JSON</button></div>
 <textarea id="o" placeholder="Choisis un format : le contenu apparaît ici."></textarea>
 <div class="row"><button onclick="cp()">Copier</button><button onclick="dl()">Télécharger / partager</button></div><div id="xm" class="mu"></div></div>
 <div class="card"><b>Restaurer une sauvegarde (fichier SQL ou JSON)</b><input type="file" id="fi" accept=".sql,.json,.txt" onchange="rf(this)"><textarea id="im" placeholder="Ou colle ici le contenu du fichier"></textarea><button onclick="imp()">Restaurer</button></div>`;if(ls(K+'_fb'))fbList()}
function cp(){const t=$('o');t.select();try{navigator.clipboard.writeText(t.value).then(()=>{$('xm').textContent='Copié.';markBk()},()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}}
async function dl(){
 const t=$('o'),n=t.dataset.n||'export.txt';if(!t.value)return;
 const f=new File([t.value],n,{type:t.dataset.m||'text/plain'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:n});markBk();return}}catch(e){}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n;document.body.appendChild(a);a.click();a.remove();markBk();$('xm').textContent='Si rien ne se télécharge, utilise « Copier » et colle dans un fichier.'}catch(e){$('xm').textContent='Utilise « Copier ».'}
}
function rf(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('im').value=r.result};r.readAsText(f)}
function pv(s){const o=[];let i=0;while(i<s.length){const c=s[i];if(c==="'"){let v='';i++;while(i<s.length){if(s[i]==="'"){if(s[i+1]==="'"){v+="'";i+=2;continue}i++;break}v+=s[i++]}o.push(v)}else if(c===','||c===' '){i++}else{let j=i;while(j<s.length&&s[j]!==',')j++;o.push(parseFloat(s.slice(i,j)));i=j}}return o}
function fromSQL(t){
 const R={groups:[],students:[],sessions:[],pays:[]};let n=0;
 t.split(/\r?\n/).forEach(l=>{const m=l.match(/^INSERT INTO (\w+) VALUES\((.*)\);\s*$/);if(!m)return;const v=pv(m[2]);n++;
  if(m[1]==='groupes')R.groups.push({id:v[0],name:v[1],h:v[2],c:v[3]||''});
  else if(m[1]==='eleves')R.students.push({id:v[0],n:v[1],p:v[2],t:v[3],tp:v[4],niv:v[5],sec:v[6],ly:v[7],g:v[8],m:v[9]?v[9].split(','):[],sd:v[10]||0});
  else if(m[1]==='seances')R.sessions.push({id:v[0],g:v[1],d:v[2],m:v[3],att:[]});
  else if(m[1]==='presences'){const x=R.sessions.find(z=>z.id===v[0]);if(x)x.att.push(v[1])}
  else if(m[1]==='paiements')R.pays.push({id:v[0],s:v[1],d:v[2],a:v[3],n:v[4]})});
 if(!n)throw 0;return R}
function imp(){try{const t=$('im').value.trim();const j=t[0]==='{'?JSON.parse(t):fromSQL(t);if(!j.groups||!j.students)throw 0;if(!confirm('Remplacer toutes les données actuelles ?'))return;D=Object.assign({groups:[],students:[],sessions:[],pays:[]},j);save();alert('Données restaurées');tab='s';render()}catch(e){alert('Fichier non reconnu (SQL ou JSON de cette application)')}}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script></body></html>
